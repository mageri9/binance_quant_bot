services:
  bot:
    image: ${GHCR_IMAGE_NAME:-ghcr.io/mageri9/binance_quant_bot}:latest
    container_name: binance_quant_bot
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/marketmind.db
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./models:/app/models
    networks:
      - nexus_shared

networks:
  nexus_shared:
    external: true
